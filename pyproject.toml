[project]
name = "yap-auto-editor-demo"
version = "0.1.0"
description = "Take-home demo: discover, rank, and validate short-form moments from founder footage"
requires-python = ">=3.10"
dependencies = ["openai>=1.40.0", "pydantic>=2.7.0"]

[project.scripts]
yap-demo = "yap_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
